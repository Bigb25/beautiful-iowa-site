name: Temporary lockfile refresh (no publishing)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  lock-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Run npm install and capture exact generated lockfile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require("node:fs");
          const lock = fs.readFileSync("package-lock.json", "utf8");
          console.log("LOCK_GENERATED_BEGIN:" + lock.length);
          for (let i = 0; i < lock.length; i += 1000) {
            console.log("LOCK_JSON_CHUNK:" + JSON.stringify(lock.slice(i, i + 1000)));
          }
          console.log("LOCK_GENERATED_END");
          NODE
      - name: Check the refreshed lock passes npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
