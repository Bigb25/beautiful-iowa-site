name: Temporary mobile header Prettier audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-mobile-header
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Run npm format and export canonical two-file output
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run format
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' 'src/components/Header.astro' 'src/layouts/Layout.astro' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          npm run format:check
          echo "FORMAT_PATCH_BEGIN"
          git diff -- src/components/Header.astro src/layouts/Layout.astro
          echo "FORMAT_PATCH_END"
          echo "FORMAT_OUTPUT_BEGIN"
          node <<'NODE'
          const fs=require('node:fs');
          for(const path of ['src/components/Header.astro','src/layouts/Layout.astro']){
            const contents=fs.readFileSync(path,'utf8');
            for(let i=0,n=0;i<contents.length;i+=800,n++){
              console.log('PFMT_CHUNK:'+encodeURIComponent(path)+':'+n+':'+JSON.stringify(contents.slice(i,i+800)));
            }
          }
          NODE
          echo "FORMAT_OUTPUT_END"
          echo "PASS_EXACT_TWO_FILES"
